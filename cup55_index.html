<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game of 55 Tracker</title>
<style>
  :root {
    --accent: #d1495b;
    --accent-dark: #a83247;
    --ink: #1f2430;
    --muted: #6b7280;
    --bg: #faf9f7;
    --card: #ffffff;
    --border: #e7e3dd;
    --green: #2e8b57;
    --red: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 16px; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  .win-toggle { display: flex; gap: 8px; margin-top: 4px; }
  .win-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .win-toggle button.active-win { background: #e7f6ec; border-color: var(--green); color: var(--green); font-weight: 700; }
  .win-toggle button.active-loss { background: #fbeaea; border-color: var(--red); color: var(--red); font-weight: 700; }

  .submit-btn {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .submit-btn:hover { background: var(--accent-dark); }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  .status-msg { font-size: 13px; margin-top: 8px; }
  .status-msg.err { color: var(--red); }
  .status-msg.ok { color: var(--green); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .rank { font-weight: 700; color: var(--accent); width: 24px; }
  .avg-cups { font-weight: 700; }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-main { flex: 1; }
  .history-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; margin-left: 6px; }
  .badge.win { background: #e7f6ec; color: var(--green); }
  .badge.loss { background: #fbeaea; color: var(--red); }
  .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  .del-btn:hover { color: var(--red); }

  .session-header { font-weight: 700; margin: 16px 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  .session-header:first-child { margin-top: 0; }

  .whoami { display: flex; gap: 8px; align-items: center; }
  .whoami input { flex: 1; }
  .whoami button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-family: inherit; }
  .empty-state { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<header>
  <h1>🏆 Game of 55 Tracker</h1>
  <p>Log your cups after every game -- averages update automatically.</p>
</header>

<main>

  <div class="card">
    <h2>Who are you?</h2>
    <div class="whoami">
      <input type="text" id="my-name" placeholder="Your name" list="player-list">
      <datalist id="player-list"></datalist>
      <button onclick="saveMyName()">Save</button>
    </div>
    <div class="status-msg" id="whoami-status"></div>
  </div>

  <div class="card">
    <h2>Log a game</h2>
    <label for="cups-made">Cups you made (out of <span id="max-cups-label">55</span>)</label>
    <input type="number" id="cups-made" min="0" max="55" placeholder="e.g. 32">

    <div class="row">
      <div>
        <label for="opponent-name">Opponent (optional)</label>
        <input type="text" id="opponent-name" placeholder="Who'd you play?">
      </div>
      <div>
        <label for="game-date">Date</label>
        <input type="date" id="game-date">
      </div>
    </div>

    <label for="session-label">Session name (optional)</label>
    <input type="text" id="session-label" placeholder="e.g. Friday night at Jake's">

    <label>Result</label>
    <div class="win-toggle">
      <button type="button" id="win-btn" onclick="setWon(true)">Won</button>
      <button type="button" id="loss-btn" onclick="setWon(false)">Lost</button>
      <button type="button" id="unknown-btn" onclick="setWon(null)">Not sure</button>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitGame()">Log game</button>
    <div class="status-msg" id="submit-status"></div>
  </div>

  <div class="card">
    <h2>Leaderboard <span style="font-weight:400; color:var(--muted); font-size:12px;">(by average cups made)</span></h2>
    <table id="leaderboard-table">
      <thead>
        <tr><th></th><th>Player</th><th>Games</th><th>Avg cups</th><th>Win %</th></tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
    <div class="empty-state" id="leaderboard-empty" style="display:none;">No games logged yet -- be the first!</div>
  </div>

  <div class="card">
    <h2>History</h2>
    <div id="history-list"></div>
    <div class="empty-state" id="history-empty" style="display:none;">Nothing logged yet.</div>
  </div>

</main>

<script>
let wonValue = null; // true / false / null

function saveMyName() {
  const name = document.getElementById('my-name').value.trim();
  const statusEl = document.getElementById('whoami-status');
  if (!name) {
    statusEl.textContent = 'Enter a name first.';
    statusEl.className = 'status-msg err';
    return;
  }
  localStorage.setItem('cup55_my_name', name);
  statusEl.textContent = `Saved -- you're logging games as "${name}".`;
  statusEl.className = 'status-msg ok';
  loadHistory(); // refresh delete-button visibility
}

function myName() {
  return localStorage.getItem('cup55_my_name') || '';
}

function setWon(val) {
  wonValue = val;
  document.getElementById('win-btn').className = val === true ? 'active-win' : '';
  document.getElementById('loss-btn').className = val === false ? 'active-loss' : '';
  document.getElementById('unknown-btn').className = '';
}

async function submitGame() {
  const statusEl = document.getElementById('submit-status');
  const submitBtn = document.getElementById('submit-btn');
  const name = myName();

  if (!name) {
    statusEl.textContent = 'Save your name above first.';
    statusEl.className = 'status-msg err';
    return;
  }

  const cupsMade = document.getElementById('cups-made').value;
  if (cupsMade === '') {
    statusEl.textContent = 'Enter how many cups you made.';
    statusEl.className = 'status-msg err';
    return;
  }

  const payload = {
    player_name: name,
    cups_made: parseInt(cupsMade, 10),
    opponent_name: document.getElementById('opponent-name').value,
    game_date: document.getElementById('game-date').value,
    session_label: document.getElementById('session-label').value,
    won: wonValue,
  };

  submitBtn.disabled = true;
  statusEl.textContent = 'Saving...';
  statusEl.className = 'status-msg';

  try {
    const resp = await fetch('/api/games', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    submitBtn.disabled = false;
    if (!resp.ok) {
      statusEl.textContent = data.error || 'Something went wrong.';
      statusEl.className = 'status-msg err';
      return;
    }
    statusEl.textContent = 'Logged!';
    statusEl.className = 'status-msg ok';
    document.getElementById('cups-made').value = '';
    document.getElementById('opponent-name').value = '';
    document.getElementById('session-label').value = '';
    setWon(null);
    loadLeaderboard();
    loadHistory();
    loadPlayers();
  } catch (e) {
    submitBtn.disabled = false;
    statusEl.textContent = 'Request failed: ' + e.message;
    statusEl.className = 'status-msg err';
  }
}

async function loadLeaderboard() {
  const resp = await fetch('/api/stats');
  const data = await resp.json();
  document.getElementById('max-cups-label').textContent = data.max_cups;

  const body = document.getElementById('leaderboard-body');
  const empty = document.getElementById('leaderboard-empty');
  body.innerHTML = '';

  if (!data.leaderboard.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  data.leaderboard.forEach((p, i) => {
    const tr = document.createElement('tr');
    const winPct = p.win_rate === null ? '&mdash;' : p.win_rate + '%';
    tr.innerHTML = `
      <td class="rank">${i + 1}</td>
      <td>${p.player_name}</td>
      <td>${p.games_played}</td>
      <td class="avg-cups">${p.avg_cups}</td>
      <td>${winPct}</td>
    `;
    body.appendChild(tr);
  });
}

function fmtDate(iso) {
  try {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  } catch (e) { return iso; }
}

async function loadHistory() {
  const resp = await fetch('/api/games');
  const data = await resp.json();
  const list = document.getElementById('history-list');
  const empty = document.getElementById('history-empty');
  list.innerHTML = '';

  if (!data.entries.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const me = myName();
  let lastGroup = null;

  data.entries.forEach(e => {
    const groupKey = e.session_label ? e.session_label : fmtDate(e.game_date);
    if (groupKey !== lastGroup) {
      const h = document.createElement('div');
      h.className = 'session-header';
      h.textContent = e.session_label ? `${e.session_label} -- ${fmtDate(e.game_date)}` : fmtDate(e.game_date);
      list.appendChild(h);
      lastGroup = groupKey;
    }

    const item = document.createElement('div');
    item.className = 'history-item';
    const badge = e.won === 1 ? '<span class="badge win">WIN</span>'
      : e.won === 0 ? '<span class="badge loss">LOSS</span>' : '';
    const opp = e.opponent_name ? ` vs ${e.opponent_name}` : '';
    const delBtn = (e.player_name === me)
      ? `<button class="del-btn" onclick="deleteEntry(${e.id})">Delete</button>` : '';

    item.innerHTML = `
      <div class="history-main">
        <strong>${e.player_name}</strong> made <strong>${e.cups_made}</strong> cups${opp}${badge}
        <div class="history-meta">${fmtDate(e.game_date)}</div>
      </div>
      ${delBtn}
    `;
    list.appendChild(item);
  });
}

async function deleteEntry(id) {
  const me = myName();
  if (!me) return;
  if (!confirm('Delete this entry?')) return;
  const resp = await fetch('/api/games/' + id, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ player_name: me }),
  });
  if (resp.ok) {
    loadLeaderboard();
    loadHistory();
  }
}

async function loadPlayers() {
  const resp = await fetch('/api/players');
  const data = await resp.json();
  const dl = document.getElementById('player-list');
  dl.innerHTML = data.players.map(p => `<option value="${p}">`).join('');
}

// Init
document.getElementById('game-date').value = new Date().toISOString().slice(0, 10);
const savedName = myName();
if (savedName) {
  document.getElementById('my-name').value = savedName;
  document.getElementById('whoami-status').textContent = `Logging games as "${savedName}".`;
  document.getElementById('whoami-status').className = 'status-msg ok';
}
loadLeaderboard();
loadHistory();
loadPlayers();
</script>

</body>
</html>
